name: Update Instagram tagged feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Walk the entire tagged history (use for the first backlog import)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch tagged posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.instagram.com' }}
          IG_FULL_SYNC: ${{ inputs.full_sync && '1' || '0' }}
        run: node scripts/fetch-tagged.mjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json media
          if git diff --staged --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore: update tagged feed"
            git push
          fi
